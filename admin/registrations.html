<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلبات التسجيل — إدارة الموقع | ألف المستقبل</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <img src="../assets/logo.svg" alt="ألف المستقبل">
      <strong>لوحة إدارة الموقع</strong>
    </div>
    <nav class="admin-nav">
      <a href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        لوحة التحكم
      </a>
      <a href="registrations.html" class="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        طلبات التسجيل
      </a>
      <a href="leads.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        طلبات شراكة المدارس
      </a>
      <span class="nav-section-label">الموقع العام</span>
      <a href="content.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        محتوى الموقع
      </a>
      <a href="settings.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        الإعدادات
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="logout-btn" data-logout>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        تسجيل الخروج
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" aria-label="فتح القائمة">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#05045E" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1>طلبات التسجيل</h1>
      </div>
      <div class="who">
        <span class="email" data-admin-email>—</span>
        <span class="avatar" data-admin-initial>A</span>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>طلبات التسجيل</h2>
          <p>كل الطلبات المُرسلة عبر نموذج التسجيل في الموقع العام</p>
        </div>
      </div>

      <div class="admin-panel">
        <div class="panel-head">
          <div class="table-toolbar">
            <div class="search-box">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="reg-search" placeholder="ابحث باسم الطالب أو ولي الأمر...">
            </div>
            <select class="filter-select" id="reg-filter">
              <option value="all">كل الحالات</option>
              <option value="new">جديد</option>
              <option value="contacted">تم التواصل</option>
              <option value="enrolled">مقبول</option>
            </select>
          </div>
        </div>
        <div class="panel-body">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>الطالب</th><th>المرحلة</th><th>ولي الأمر</th><th>المدرسة</th><th>التاريخ</th><th>الحالة</th><th></th>
                </tr>
              </thead>
              <tbody id="reg-table-body"></tbody>
            </table>
          </div>
          <div class="empty-state" id="reg-empty" style="display:none">لا توجد نتائج مطابقة</div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="reg-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>تفاصيل طلب التسجيل</h3>
      <button class="modal-close" id="reg-modal-close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="reg-modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost-light btn-sm" id="reg-delete-btn">حذف الطلب</button>
      <button class="btn btn-primary btn-sm" id="reg-modal-done">إغلاق</button>
    </div>
  </div>
</div>

<script src="../js/site-data.js"></script>
<script src="js/admin.js"></script>
<script src="js/registrations.js"></script>
</body>
</html>
